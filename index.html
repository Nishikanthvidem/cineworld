<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#27282f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cinema">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--head:#27282f;--bg:#1e1e23;--card:#27272e;--band:#2c3347;--line:#3a3b45;--red:#e8232b;--text:#fff;--muted:#a9abb5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;font-family:Outfit,system-ui,sans-serif;color:var(--text);display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:0}
header{background:var(--head);height:62px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;padding-top:env(safe-area-inset-top)}
.logo{font-size:34px;font-weight:400;letter-spacing:-1.5px;display:flex;align-items:center;gap:2px}
.logo svg{width:32px;height:32px;margin-right:-2px}
.ava{position:absolute;right:16px;width:36px;height:36px;border-radius:50%;background:#8a8a8a;overflow:hidden}
.ava svg,.bigava svg{width:100%;height:100%;display:block}
.hbtn{position:absolute;width:30px;height:30px;display:grid;place-items:center}
main{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:0 18px}
.lbl{font-size:18px;font-weight:300;padding:18px 18px 10px}
.field{margin:0 18px;height:36px;border:1px solid var(--line);background:#191b25;border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:17px;font-weight:300;width:calc(100% - 36px)}
.field svg{width:18px;height:18px}
.sec{font-size:18px;font-weight:300;padding:22px 22px 12px}
.band{height:8px;background:var(--band);border-top:1px solid #384058;margin-top:18px}
.row{display:flex;gap:11px;overflow-x:auto;padding:0 18px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.reward{flex:none;width:254px;height:98px;background:var(--card);border-radius:10px;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:17px;font-weight:300;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.reward span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-pop{flex:none;width:70px;height:70px;position:relative}
.logo-pop i{position:absolute;inset:6px 0 0 0;border-radius:50%;background:#e8232b}
.logo-pop svg{position:absolute;inset:0}
.logo-evt{flex:none;width:96px;height:70px;position:relative}
.logo-evt i{position:absolute;left:14px;top:2px;width:68px;height:68px;border-radius:50%;background:#e8232b}
.logo-evt b{position:absolute;left:0;top:19px;width:100%;background:#fff;color:#222;font:700 15px Outfit;line-height:1.05;padding:4px 6px 5px;clip-path:polygon(0 0,100% 0,100% 100%,8% 100%)}
.logo-evt b em{display:block;color:#e8232b;font-size:13px;text-align:right;font-style:normal}
.tabs{display:flex;padding:0 18px;border-bottom:1px solid var(--line);margin-top:6px}
.tabs button{font-size:18px;font-weight:300;padding:16px 18px 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{border-color:var(--red)}
.posters{display:flex;gap:7px;overflow-x:auto;padding:14px 18px;scrollbar-width:none}
.posters::-webkit-scrollbar{display:none}
.film{flex:none;width:102px}
.poster{width:102px;height:152px;border-radius:9px;border:1px solid #3a3b45;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:8px 6px;text-align:center;font-weight:600;line-height:.95;text-transform:uppercase;letter-spacing:-.3px;font-size:15px}
.bm{position:absolute;top:6px;right:6px;width:22px;height:22px}
.bm svg{width:100%;height:100%}
.ft{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:8px;font-size:16px}
.ft span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.age{flex:none;width:23px;height:23px;border-radius:50%;font-size:9px;font-weight:600;display:grid;place-items:center;color:#fff;border:2px solid rgba(255,255,255,.5)}
.a12A{background:#f7941d}.a15{background:#e8318f}.aPG{background:#2f9fd8}.aU{background:#3fae49}
.banner{flex:none;width:303px;height:150px;border-radius:0;display:flex;align-items:flex-end;padding:14px;font-size:22px;font-weight:600;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:14px 18px}
.grid .film,.grid .poster{width:100%}.grid .poster{height:auto;aspect-ratio:2/3;font-size:20px}
.item{margin:0 18px 12px;background:var(--card);border-radius:10px;padding:16px}
.item h3{font-weight:500;font-size:18px}.item p{color:var(--muted);font-size:14px;margin-top:4px}
.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.times button{border:1px solid var(--red);border-radius:6px;padding:7px 12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:70px 30px;font-size:17px;font-weight:300}
.bigava{width:132px;height:132px;border-radius:50%;background:#8a8a8a;margin:24px auto 0;overflow:hidden}
.center{text-align:center}
.name{font-size:30px;font-weight:300;margin-top:26px}
.sub{font-size:19px;font-weight:300;margin-top:10px}
.link{font-size:20px;font-weight:300;letter-spacing:1px;margin:20px 0 26px}
.btn{display:block;width:calc(100% - 36px);margin:18px 18px 22px;height:52px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:19px;font-weight:300;letter-spacing:1px}
.ln{width:100%;display:flex;justify-content:space-between;align-items:center;padding:22px 22px;border-bottom:1px solid var(--line);font-size:19px;font-weight:300;text-align:left}
.ln svg{width:12px}
.plain{padding:0 18px 22px;font-size:19px;font-weight:300}
nav{flex:none;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(14px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;font-weight:300}
nav svg{width:26px;height:26px}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;top:76px;bottom:0;background:#1e1e23;border-radius:22px 22px 0 0;overflow:hidden;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.handle{background:var(--head);height:54px;display:grid;place-items:center}
.handle i{width:56px;height:4px;border-radius:2px;background:#8a8fa0}
.who{background:#808080;height:230px;display:flex;align-items:center;gap:28px;padding:0 90px 0 90px;margin:0}
.who .c{width:86px;height:86px;border-radius:50%;background:#808080;border:1px solid #6a6a6a;flex:none;overflow:hidden}
.who small{font-size:16px;font-weight:300;display:block}.who div b{font-weight:300;font-size:22px}
.qr{display:block;background:#fff;padding:10px;width:108px;margin:26px auto 0;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.meta{text-align:center;margin-top:40px;font-weight:300}.meta small{font-size:17px;display:block}.meta b{font-weight:300;font-size:27px;display:block;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <div id="hd"></div>
  <main id="view"></main>
  <nav id="nav"></nav>
  <div class="sheet" id="sheet" onclick="if(event.target===this)card(false)">
    <div class="panel">
      <div class="handle" onclick="card(false)"><i></i></div>
      <div class="who"><div class="c" id="c1"></div><div><small>Name</small><b id="nm"></b></div></div>
      <svg class="qr" id="qr" viewBox="0 0 21 21" shape-rendering="crispEdges"></svg>
      <div class="meta"><small>Card number</small><b id="cn"></b></div>
      <div class="meta"><small>Member since</small><b id="ms"></b></div>
    </div>
  </div>
</div>

<script>
// ---------- Mock data: edit freely ----------
const USER={name:"Sri Vishal Garapati",cardNo:String(Math.floor(100000000000000+Math.random()*899999999999999)),since:"21/07/2026"};
const orders=[
 {film:"The Paradise (Telugu)",cinema:"Hounslow",when:"Fri 25 Sep 15:40",qty:1,bg:"linear-gradient(160deg,#7a1f1f,#1a0a0a)",fg:"#f2c14e"}
];
const cinemas=["Wembley","Leicester Square","Enfield","Ealing","Hounslow"];
const films=[
 {id:1,title:"Avengers: Endgame",short:"Avengers Endgame",age:"12A",now:1,bg:"linear-gradient(160deg,#8b8e94,#2b2d31)",fg:"#dcdde0"},
 {id:2,title:"Heart Of The Beast",short:"Heart of the Beast",age:"12A",now:1,bg:"linear-gradient(160deg,#c9b99a,#5b4a36)",fg:"#fff"},
 {id:3,title:"Resident Evil",short:"Resident Evil",age:"15",now:1,bg:"linear-gradient(160deg,#5b5d57,#121212)",fg:"#c8241f"},
 {id:4,title:"Shaun The Sheep",short:"Shaun the Sheep",age:"PG",now:1,bg:"linear-gradient(160deg,#f29a35,#5a7a2a)",fg:"#fff"},
 {id:5,title:"Paper Moons",short:"Paper Moons",age:"U",now:1,bg:"linear-gradient(160deg,#f2b84b,#7a4a00)",fg:"#fff"},
 {id:6,title:"Neon Harbour",short:"Neon Harbour",age:"12A",now:0,bg:"linear-gradient(160deg,#e84a8a,#450a24)",fg:"#fff"},
 {id:7,title:"Deep Static",short:"Deep Static",age:"15",now:0,bg:"linear-gradient(160deg,#6c5ce7,#1c1450)",fg:"#fff"}
];
const rewards=[["popcorn","10% off Retail (Red Carpet)"],["event","5 Off Event Cinema"],["popcorn","Free small popcorn"]];
const banners=[["linear-gradient(160deg,#8a8f7a,#3c3f34)","We are a can-do classroom"],["linear-gradient(160deg,#6a3fa8,#2a1258)","Camino Movie Nights"]];
const S={tab:"home",sub:"now",cinema:"Wembley",watch:new Set(),pick:false};

// ---------- Icons ----------
const I={
 star:'<svg viewBox="0 0 40 40" fill="none" stroke="#e8232b" stroke-width="3"><path d="M20 3l4 12 14-3-9 10 7 12-14-3-2 14-6-13-14 2 10-9L4 8l13 3z" stroke-linejoin="round"/></svg>',
 user:'<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#8a8a8a"/><path d="M50 22c14 0 20 10 18 24-1 8-5 12-4 16 1 4 8 6 16 9 6 3 8 10 8 20H12c0-10 2-17 8-20 8-3 15-5 16-9 1-4-3-8-4-16-2-14 4-24 18-24z" fill="#1c1e2b"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 bm:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
 bmOn:'<svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
 back:'<svg viewBox="0 0 24 24" width="28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>',
 run:'<svg viewBox="0 0 24 24" width="20" fill="#fff"><circle cx="15" cy="4" r="2.2"/><path d="M8 22l3-7-3-2 2-5 4 2 3 4 3 1-.6 2-4-1-2-3-1 3 3 3v4h-2l-.5-3.5L10 22z"/></svg>',
 chev:'<svg viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>',
 films:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M2 6h20v4a2 2 0 000 4v4H2v-4a2 2 0 000-4z"/></svg>',
 cin:'<svg viewBox="0 0 24 24" fill="#fff"><circle cx="9" cy="5" r="2.2"/><circle cx="14" cy="5" r="2.2"/><circle cx="17.5" cy="8" r="1.8"/><path d="M4 9h10v3l4-2v10H4z"/></svg>',
 watch:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 2h12v20l-6-5-6 5z"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>'
};
const popLogo='<div class="logo-pop"><i></i><svg viewBox="0 0 70 70"><path d="M14 22h40l-6 40H20z" fill="#111"/><path d="M18 22c-3-8 4-14 10-11 3-6 12-6 14 0 7-3 12 4 8 11z" fill="#f3e94a"/><path d="M34 32l3 8 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1z" fill="none" stroke="#e8232b" stroke-width="2"/></svg></div>';
const evtLogo='<div class="logo-evt"><i></i><b>EVENT<em>CINEMA</em></b></div>';

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const go=t=>{S.tab=t;S.pick=false;render();$("#view").scrollTop=0};
const toggle=id=>{S.watch.has(id)?S.watch.delete(id):S.watch.add(id);render()};
const card=o=>$("#sheet").classList.toggle("open",o);
const rw=r=>`<div class="reward">${r[0]==="popcorn"?popLogo:evtLogo}<span>${r[1]}</span></div>`;
const film=f=>`<div class="film"><div class="poster" style="background:${f.bg};color:${f.fg}">${f.short}
 <button class="bm" onclick="toggle(${f.id})" aria-label="Watchlist">${S.watch.has(f.id)?I.bmOn:I.bm}</button></div>
 <div class="ft"><span>${f.title}</span><b class="age a${f.age}">${f.age}</b></div></div>`;

// ---------- Screens ----------
const home=()=>`
 <div class="lbl">Choose cinemas</div>
 <button class="field" onclick="S.pick=!S.pick;render()"><span>${S.cinema}</span>${I.pin}</button>
 ${S.pick?`<div class="item" style="margin-top:8px">${cinemas.map(c=>`<button class="ln" style="padding:12px 0;font-size:17px" onclick="S.cinema='${c}';S.pick=false;render()">${c}</button>`).join("")}</div>`:""}
 <div class="sec" style="padding-top:26px">My rewards</div>
 <div class="row">${rewards.slice(0,2).map(rw).join("")}</div>
 <div class="band" style="margin-top:22px"></div>
 <div class="tabs"><button class="${S.sub==='now'?'on':''}" onclick="S.sub='now';render()">Now showing</button><button class="${S.sub==='soon'?'on':''}" onclick="S.sub='soon';render()">Coming soon</button></div>
 <div class="posters">${films.filter(f=>!!f.now===(S.sub==='now')).map(film).join("")}</div>
 <div class="band" style="margin-top:6px"></div>
 <div class="row" style="padding:0;gap:0;margin-top:8px">${banners.map(b=>`<div class="banner" style="background:${b[0]}">${b[1]}</div>`).join("")}</div>`;

const screens={
 home,
 films:()=>`<div class="sec">All films</div><div class="grid" style="padding-top:0">${films.map(film).join("")}</div>`,
 cinemas:()=>`<div class="sec">Cinemas</div>${cinemas.map(c=>`<div class="item"><h3>${c}</h3><p>Today: ${films[0].title}</p>
  <div class="times">${["12:30","15:10","18:00","20:45"].map(t=>`<button>${t}</button>`).join("")}</div>
  <button class="btn" style="width:100%;margin:14px 0 0;height:44px;font-size:16px" onclick="S.cinema='${c}';go('home')">${c===S.cinema?"Selected":"Select cinema"}</button></div>`).join("")}`,
 watch:()=>{const l=films.filter(f=>S.watch.has(f.id));return `<div class="sec">My watchlist</div>`+(l.length?`<div class="grid" style="padding-top:0">${l.map(film).join("")}</div>`:`<div class="empty">Nothing saved yet.<br>Tap the bookmark on a film to add it.</div>`)},
 more:()=>`<div class="sec">More</div><button class="ln" onclick="go('account')">My account ${I.chev}</button><button class="ln">Offers ${I.chev}</button><button class="ln">Help ${I.chev}</button><button class="ln">Settings ${I.chev}</button>`,
 account:()=>`
  <div class="bigava">${I.user}</div>
  <div class="center"><div class="name">${USER.name}</div><div class="sub">MyCineworld</div>
  <button class="link" onclick="card(true)">View card</button></div>
  <div class="band" style="margin-top:0"></div>
  <div class="sec" style="padding-top:26px">My orders (${orders.length})</div>
  ${orders.length?orders.map(o=>`
  <div class="item" style="display:flex;gap:14px;align-items:stretch">
    <div style="flex:1;min-width:0">
      <h3 style="font-size:17px">${o.film}</h3>
      <p style="margin-top:8px">${o.cinema}</p>
      <p>${o.when}</p>
      <p style="margin-top:8px;display:flex;align-items:center;gap:6px"><span style="width:16px;height:16px;display:inline-block">${I.films}</span> x${o.qty}</p>
    </div>
    <div style="flex:none;width:84px;height:118px;border-radius:8px;background:${o.bg};color:${o.fg};display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:600;line-height:1.05;text-transform:uppercase">${o.film}</div>
  </div>`).join(""):`<div class="plain" style="padding-top:10px">You don't have any upcoming orders.</div>`}
  <button class="btn">View all</button>
  <div class="band" style="margin-top:0"></div>
  <div class="sec" style="padding-top:26px">My rewards (3)</div>
  <div class="row">${rewards.slice(0,2).map(rw).join("")}</div>
  <button class="btn">View all</button>
  <div class="band" style="margin-top:0"></div>
  <button class="ln">Personal details ${I.chev}</button><button class="ln">Payment card wallet ${I.chev}</button>`
};

const navItems=[["home","Home"],["films","Films"],["cin","Cinemas"],["watch","My watchlist"],["more","More"]];
const navGo={home:"home",films:"films",cin:"cinemas",watch:"watch",more:"more"};

function render(){
  $("#hd").innerHTML=S.tab==="account"
   ?`<header><button class="hbtn" style="left:14px" onclick="go('home')">${I.back}</button><span style="font-size:26px;font-weight:300">My account</span><button class="hbtn" style="right:14px;width:40px;height:40px;border:1.5px solid #fff;border-radius:50%">${I.run}</button></header>`
   :`<header><div class="logo">${I.star}cineworld</div><button class="ava" onclick="go('account')" aria-label="Account">${I.user}</button></header>`;
  $("#view").innerHTML=screens[S.tab]();
  $("#nav").innerHTML=navItems.map(n=>`<button onclick="go('${navGo[n[0]]}')">${I[n[0]]}${n[1]}</button>`).join("");
}

// Card sheet content + decorative QR (not scannable)
$("#c1").innerHTML=I.user;$("#nm").textContent=USER.name;$("#cn").textContent=USER.cardNo;$("#ms").textContent=USER.since;
(function(){let s=7,o="";const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
 const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);if(!f&&r()>.5)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 $("#qr").innerHTML=o+fin(0,0)+fin(14,0)+fin(0,14)})();

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
